name: Search for cars

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: no notifications, nothing saved"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Search
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCES: autodiiler   # okidoki and soov block GitHub; the home PC searches those
          RUN_ALL_SOURCES: ${{ github.event_name == 'workflow_dispatch' }}
        run: python finder.py
      - name: Save what was seen
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "car-finder bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json MATCHES.md
          git diff --cached --quiet || git commit -m "Update seen listings" && git push

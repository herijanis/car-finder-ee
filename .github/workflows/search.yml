name: Search for cars

# The Hetzner server now searches autodiiler and autoportaal (deploy/); this is only a manual fallback.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: no Telegram messages, nothing saved"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the latest state, not the commit that was current when this run was queued
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Search
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCES: autodiiler,autoportaal   # okidoki and soov block GitHub; the home PC searches those
          RUN_ALL_SOURCES: ${{ github.event_name != 'schedule' }}
        run: python finder.py
      - name: Save what was seen
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "car-finder bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || { git commit -m "Update seen listings" && git pull --rebase && git push; }
